    <title>Document</title>
  </head>
  <body>
    <!--
    Anidar determina quién depende de quién.
    <ul> o <ol> determina cómo se representa esa lista.
    type modifica el tipo de numeración de un <ol>.
    -->
    Índice del libro
    <ol>
      <li>Tema1:
        <ol>
          <li>Subtema1</li>
          <li>Subtema2:
            <ol type="a">
              <li>SubtemaA</li>
              <li>SubtemaB</li>
            </ol>
          </li>
          <li>Subtema3</li>
        </ol>
      </li>
      <li>Tema2</li>
      <li>Tema3</li>
      <li>Tema4:
        <ol>
            <li>Subtema1</li>
            <li>Subtema2</li>
            <li>Subtema3</li>
        </ol>
      </li>
      <li>Tema5</li>
      <li>Tema6</li>
      <li>Tema7</li>

    </ol>
  </body>
</html>
