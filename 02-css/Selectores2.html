<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Tabla de Colores</title>
    <style>
     tr:nth-child(1){color: teal;}   
     tr:nth-child(2){color: red;}
     tr:nth-child(3){color:blue;}
     tr:nth-child(4){color:orange;}
     tr:nth-child(5){color:purple;}
     tr:nth-child(6){color:olive;}
     tr:nth-child(7){color:fuchsia;}
     tr:nth-child(8){color:green;}
     td:nth-child(1){background-color:white;}
     td:nth-child(2){background-color:red;}
     td:nth-child(3){background-color:green;}
    </style>
</head>
    <body>
        
    
      <table border="1">
        <tr>
          <td>teal</td>
          <td>teal</td>
          <td>teal</td>
        </tr>

        <tr>
          <td>red</td>
          <td>red</td>
          <td>red</td>
        </tr>

        <tr>
          <td>blue</td>
          <td>blue</td>
          <td>blue</td>
        </tr>

        <tr>
          <td>orange</td>
          <td>orange</td>
          <td>orange</td>
        </tr>
        <tr>
          <td>purple</td>
          <td>purple</td>
          <td>purple</td>
        </tr>
        <tr>
          <td>olive</td>
          <td>olive</td>
          <td>olive</td>
        </tr>
        <tr>
          <td>fuchsia</td>
          <td>fuchsia</td>
          <td>fuchsia</td>
          </tr>
        <tr>
          <td>green</td>
          <td>green</td>
          <td>green</td>
        </tr>
      </table>
    </body>
</html>
