<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de la Compra</title>

    <style>
        li:nth-child(2),
        li:nth-child(4),
        li:nth-child(7)
        {
           color: red;
        }
       
        
        li:last-child{font-size: 3rem;}
        li:nth-child(1),
        li:nth-child(3),
        li:nth-child(8)
        {
            text-transform: uppercase;
            color: green;
        }
        
        ul{
            list-style-type: square;
        }

    </style>
</head>
<body>
    <h1>Lista de la compra</h1>

    <ul>
        <li>Platano</li>
        <li>Manzana</li>
        <li>Jamon</li>
        <li>Queso</li>
        <li>Cereales</li>
        <li>Yogur</li>
        <li>Carne</li>
        <li>Pescado</li>
        <li>Lecha</li>
        <li>Sal</li>
    </ul>

</body>
</html>
