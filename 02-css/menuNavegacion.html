<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menú navegación</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
           
        }
        nav{
            margin: 0;
            padding: 0;
            }
        nav ul{
            list-style: none;
            
        }    
        nav ul li a{
            display:block;
            width: 100px;
            text-align: center;
            color: white;
            background-color: black;
            padding: 10px 5px 10px 5px;
            border-right: 5px solid #336699;    
        }
        nav ul li a:hover{
            background-color: #336699;
        }
        nav ul li a:visited{
            color: palevioletred;
        }
        
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="https://www.google.es">Inicio</a></li>
        <li><a href="https://www.wikipedia.org">Servicios</a></li>
        <li><a href="https://www.mozilla.org">Nosotros</a></li>
        <li><a href="https://www.python.org">Contacto</a></li>
      </ul>
    </nav>
  </body>
</html>
